- name: Criar diretório de destino para o projeto
  file:
    path: /opt/app
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copiar o docker-compose.yml para a máquina
  copy:
    src: docker-compose.yml
    dest: /opt/app/docker-compose.yml
    owner: root
    group: root
    mode: '0644'

- name: Criar serviço systemd para o Docker Compose
  copy:
    dest: /etc/systemd/system/docker-compose-app.service
    content: |
      [Unit]
      Description=Docker Compose Application Service
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/app
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down

      [Install]
      WantedBy=multi-user.target

- name: Habilitar o serviço no boot
  systemd:
    name: docker-compose-app.service
    enabled: yes
    daemon_reload: yes